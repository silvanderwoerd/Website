<script>
  
const staggeredText = document.querySelectorAll('.tricks');

const options = {
    root: null,
    rootMargin: '0px',
    threshold: 1.0
}

const observer = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {

        // get all elements with class .letter in the current .tricksword
        const letters = entry.target.querySelectorAll('.tricksword');

        if (entry.isIntersecting) {

            // Fade Up Animation
            let fadeUp = anime.timeline({
                loop: false,
                autoplay: false,
            });

            fadeUp
                .add({
                    targets: letters,
                    opacity: [0, 1],
                    paddingTop: ['1.07em','0em'],
                    easing: "easeOutExpo",
                    duration: 1500,
                    delay: (el, i) => 300 + 30 * i
                });

            fadeUp.play();

            // Stop observing the target
            observer.unobserve(entry.target);

        } else {
            // set letters to opacity 0
            letters.forEach(letter => {
                letter.style.opacity = 0;
            });
        }
    });
}, options);

staggeredText.forEach(text => {
    observer.observe(text);
});
  
</script></body></html>
