<blockquote class="fl-project-quote">&quot;Walking through this year’s UN Climate Conference felt overwhelming - a place where money often overshadows meaning, and nature’s voice appears to be a side concern. It was in the Indigenous Peoples pavilion where we found real connection. Their wisdom on reciprocity - giving back to Mother Nature - was transformative, a home-coming. This is the hope we hold onto, because the world is beautiful, and it’s worth fighting for, together with those who’ve been defending it all along.”</blockquote>
<figcaption>
<cite>
<p class="fl-quote-cite">Sil van der Woerd &amp; Jorik Dozy - Co-Directors</p>
