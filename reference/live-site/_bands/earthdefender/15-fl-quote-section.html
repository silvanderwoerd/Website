<blockquote class="fl-project-quote">“After months of research and conversations with representatives from over 15 Indigenous communities and local organizations, we realized that true understanding couldn’t be gained through online research alone. We needed to immerse ourselves in the culture firsthand. So, we spent a full month living with the Sungai Utik community, learning their ways, customs, and deep connection to the land and its stories. Adapting to a different rhythm and language was challenging, but filmmaking is all about people, and we wanted to truly listen and understand. Every evening, we gathered to learn from their work style and traditions, making our days to respectfully work with their schedule. It was a privilege to be welcomed by such a strong community.”</blockquote>
<figcaption>
<cite>
<p class="fl-quote-cite">Alea Rahim &amp; Sara Kong - EP &amp; Producer</p>
